<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Nagarsevak AI - Redirecting...</title>
    <script>
        // GitHub Pages SPA redirect hack
        // This 404.html page gets served by GitHub Pages when a route doesn't match an actual file.
        // It stores the current path in sessionStorage and redirects to index.html,
        // which then picks up the stored path and navigates via React Router.
        var pathSegmentsToKeep = 1; // Keep '/municipal-dashboard' prefix
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body>
    Redirecting...
</body>
</html>
